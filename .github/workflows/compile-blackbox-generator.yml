name: Compile generator blackbox
on:
  pull_request:
    paths:
      - 'devices/HAS1_generator/**'
      - 'libraries/HAS1BlackBox/**'
      - 'libraries/HAS2_Wifi/**'
      - 'libraries/HAS1BleBeacon/**'
      - 'libraries/DFRobotDFPlayerMini/**'
      - 'scripts/compile_blackbox_generator.py'
      - 'devices/iotglove/tools/compile.py'
      - 'scripts/firmware_targets.py'
      - '.github/workflows/compile-blackbox-generator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned core and registry dependencies
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install "Adafruit NeoPixel@1.12.0" "Adafruit PN532@1.3.4" "Adafruit BusIO@1.17.4" "ArduinoJson@7.4.3" "EspSoftwareSerial@8.1.0"
      - name: Prepare unchanged OTA and timer dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/blackbox-deps/SecureOTA"
          git -C "$RUNNER_TEMP/blackbox-deps/SecureOTA" init --quiet
          git -C "$RUNNER_TEMP/blackbox-deps/SecureOTA" remote add origin https://github.com/Fuzzyline-HAS2/SecureOTA
          git -C "$RUNNER_TEMP/blackbox-deps/SecureOTA" fetch --depth 1 origin 162db758e6806895ef10ca39b101f9f8753bdc20
          git -C "$RUNNER_TEMP/blackbox-deps/SecureOTA" checkout --detach FETCH_HEAD
          git clone https://github.com/marcelloromani/Arduino-SimpleTimer "$RUNNER_TEMP/timer-source"
          git -C "$RUNNER_TEMP/timer-source" checkout 23d60f37fc117f5368756bbf55e7d82ee4add051
          cp -r "$RUNNER_TEMP/timer-source/SimpleTimer" "$RUNNER_TEMP/blackbox-deps/SimpleTimer"
      - name: Link MQTT and existing OTA paths (never deploy)
        run: |
          python scripts/compile_blackbox_generator.py --libraries-dir "$RUNNER_TEMP/blackbox-deps" \
            --output-dir "$RUNNER_TEMP/blackbox-generator" --blackbox-mode mqtt
