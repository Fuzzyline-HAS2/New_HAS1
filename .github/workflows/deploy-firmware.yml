name: Deploy Firmware
# Actions 실행 목록에 뜨는 제목을 "Deploy Firmware"로 통일해서 보여주는 대신,
# 어떤 device를 배포했는지/파티션도 같이 올렸는지 한눈에 구분되도록 커스텀.
run-name: "Deploy ${{ inputs.device }}${{ inputs.update_partition && ' (+partition)' || '' }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "배포할 device 폴더"
        type: choice
        options:
          - HAS1_itembox
          - HAS1_generator
          - HAS1_revival_machine
          - HAS1_altar
          - HAS1_duct
          - HAS1_escape_main
          - HAS1_tagmachine_main
          - iotglove
          - iotglove_beetle
        default: HAS1_itembox
      update_partition:
        description: "파티션 스키마도 업데이트 (partitions.bin/sig 재생성 + 배포)"
        type: boolean
        default: false

permissions:
  contents: write

# Serialize the same device across branches because its release tag is fixed.
# Different devices deploy in parallel. SecureOTA's _push_with_retry integrates
# their version commits with fetch/rebase, attempting push up to 5 times.
concurrency:
  group: deploy-firmware-${{ inputs.device }}
  cancel-in-progress: false

env:
  ESP32_CORE_VERSION: "3.3.11"
  ESP32_BOARD_INDEX: "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 브랜치를 원격 최신 상태로 강제 동기화
        # actions/checkout은 워크플로가 "트리거된 시점"의 커밋을 체크아웃한다.
        # "Re-run failed jobs"로 재실행하면 그 사이 원격이 앞서갔어도 옛 커밋
        # 그대로 재사용돼서, 이후 커밋 push가 non-fast-forward로 거부된다
        # (detached HEAD 방지도 겸함 — 이후 커밋/푸시에 실제 브랜치가 필요).
        run: |
          git fetch origin "${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
          git branch --set-upstream-to="origin/${{ github.ref_name }}" "${{ github.ref_name }}"

      - name: git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 장치 경로와 보드별 FQBN 결정
        env:
          TARGET_DEVICE: ${{ inputs.device }}
        run: |
          python3 scripts/firmware_targets.py "$TARGET_DEVICE" >> "$GITHUB_ENV"

      - name: 배포 서명 키 확인 및 secrets.h 생성
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: python3 scripts/write_firmware_secret.py "$DEVICE_DIR"

      - name: arduino-cli 설치
        uses: arduino/setup-arduino-cli@v2

      - name: arduino-cli 초기 설정
        run: arduino-cli config init --overwrite

      - name: esp32 코어 설치 (v${{ env.ESP32_CORE_VERSION }} 고정)
        run: |
          arduino-cli core update-index --additional-urls "${{ env.ESP32_BOARD_INDEX }}"
          n=0
          until arduino-cli core install "esp32:esp32@${{ env.ESP32_CORE_VERSION }}" --additional-urls "${{ env.ESP32_BOARD_INDEX }}"; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "esp32 core install 3회 실패 (툴체인 다운로드 서버 문제로 추정)"
              exit 1
            fi
            echo "다운로드 실패 — 재시도 ($n/3, 15초 대기)..."
            sleep 15
          done

      - name: 레지스트리 라이브러리 설치 (로컬 개발 환경과 동일 버전 고정)
        # SimpleTimer는 레지스트리에 동명이인 라이브러리가 있어 "SimpleTimer@1.0.0"으로 설치하면
        # run()/deleteTimer()가 없는 다른 라이브러리가 받아질 수 있음 — 아래 커스텀 설치 단계에서
        # 실제로 쓰는 marcelloromani/Arduino-SimpleTimer를 직접 받는다.
        run: |
          arduino-cli lib install \
            "Adafruit NeoPixel@1.12.0" \
            "Adafruit PN532@1.3.4" \
            "Adafruit BusIO@1.17.4" \
            "ArduinoJson@7.4.3" \
            "DFRobotDFPlayerMini@1.0.6" \
            "ESP32Encoder@5.0.0" \
            "EspSoftwareSerial@8.1.0"

      - name: 커스텀 라이브러리 설치 (SecureOTA, HAS2_Wifi, SimpleTimer)
        env:
          TARGET_DEVICE: ${{ inputs.device }}
        run: |
          LIB_DIR="$HOME/Arduino/libraries"
          mkdir -p "$LIB_DIR"
          # Fuzzyline-HAS/libraries는 여러 저장소(다른 store들)가 공용으로 쓰고, 각자
          # 자기 브랜치(New_HAS1=first_store, 다른 저장소=third_store 등)를 갖고 있다.
          # CI는 항상 first_store의 최신 커밋을 새로 받아온다 (로컬 개발용 사본은
          # libraries/HAS2_Wifi에 별도로 있음 - libraries/README.md 참고).
          if [[ "$TARGET_DEVICE" == "iotglove" || "$TARGET_DEVICE" == "iotglove_beetle" ]]; then
            python3 devices/iotglove/tools/prepare_libraries.py --libraries-dir "$LIB_DIR"
          else
            git clone --depth 1 https://github.com/Fuzzyline-HAS2/SecureOTA "$LIB_DIR/SecureOTA"
            git clone --depth 1 --branch first_store https://github.com/Fuzzyline-HAS/libraries "$RUNNER_TEMP/has-libraries"
            cp -r "$RUNNER_TEMP/has-libraries/HAS2_Wifi" "$LIB_DIR/HAS2_Wifi"
            git clone --depth 1 https://github.com/marcelloromani/Arduino-SimpleTimer "$RUNNER_TEMP/simpletimer-src"
            cp -r "$RUNNER_TEMP/simpletimer-src/SimpleTimer" "$LIB_DIR/SimpleTimer"
          fi
          if [[ "$TARGET_DEVICE" != "iotglove" && "$TARGET_DEVICE" != "iotglove_beetle" ]]; then
            git -C "$LIB_DIR/SecureOTA" log -1 --format='SecureOTA dependency: %H'
            git -C "$RUNNER_TEMP/has-libraries" log -1 --format='HAS2_Wifi dependency: %H'
            git -C "$RUNNER_TEMP/simpletimer-src" log -1 --format='SimpleTimer dependency: %H'
          fi
          echo "SECUREOTA_SCRIPTS=$LIB_DIR/SecureOTA/scripts" >> "$GITHUB_ENV"

      - name: 버전 증가
        id: bump
        run: |
          if [ "${{ inputs.update_partition }}" = "true" ]; then
            python "$SECUREOTA_SCRIPTS/ci_deploy.py" bump "$GITHUB_WORKSPACE/$DEVICE_DIR" --partition >> "$GITHUB_OUTPUT"
          else
            python "$SECUREOTA_SCRIPTS/ci_deploy.py" bump "$GITHUB_WORKSPACE/$DEVICE_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: IoT 글러브 빌드 소스 기록
        if: inputs.device == 'iotglove' || inputs.device == 'iotglove_beetle'
        env:
          TARGET_DEVICE: ${{ inputs.device }}
        run: |
          python3 scripts/archive_iotglove_release.py capture \
            --device "$TARGET_DEVICE" \
            --capture-file "$RUNNER_TEMP/iotglove-build-source.json" \
            --dependencies "$HOME/Arduino/libraries/iotglove-dependencies.json"

      - name: 컴파일
        env:
          TARGET_DEVICE: ${{ inputs.device }}
        run: |
          mkdir -p "$RUNNER_TEMP/build-out"
          EXTRA_LIBRARIES=()
          if [[ "$TARGET_DEVICE" == "iotglove" || "$TARGET_DEVICE" == "iotglove_beetle" ]]; then
            EXTRA_LIBRARIES+=(--library "$GITHUB_WORKSPACE/libraries/IoTGloveProtocol")
          fi
          case "$TARGET_DEVICE" in
            HAS1_duct|HAS1_generator|HAS1_escape_main|HAS1_tagmachine_main)
              EXTRA_LIBRARIES+=(--library "$GITHUB_WORKSPACE/libraries/HAS1BleBeacon")
              ;;
          esac
          arduino-cli compile --fqbn "$FQBN" "${EXTRA_LIBRARIES[@]}" --output-dir "$RUNNER_TEMP/build-out" "$DEVICE_DIR"

      - name: 빌드 산출물 배치
        run: |
          cp "$RUNNER_TEMP/build-out"/*.ino.bin "$DEVICE_DIR/update.bin"
          if [ "${{ inputs.update_partition }}" = "true" ]; then
            cp "$RUNNER_TEMP/build-out"/*.ino.partitions.bin "$DEVICE_DIR/partitions.bin"
          fi

      - name: 서명 + Release 업로드 + 소스 커밋
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python "$SECUREOTA_SCRIPTS/ci_deploy.py" publish \
            "$GITHUB_WORKSPACE/$DEVICE_DIR" \
            "${{ steps.bump.outputs.NEW_VER }}" \
            "${{ steps.bump.outputs.NEW_PARTITION_VER }}"

      - name: IoT 글러브 버전별 보존 Release 추가
        # Existing fixed-tag publication above remains unchanged. An archive
        # failure fails this run but does not roll back the already updated tag.
        if: inputs.device == 'iotglove' || inputs.device == 'iotglove_beetle'
        env:
          TARGET_DEVICE: ${{ inputs.device }}
          WITH_PARTITIONS: ${{ inputs.update_partition }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVE_OPTIONS=()
          if [ "$WITH_PARTITIONS" = "true" ]; then ARCHIVE_OPTIONS+=(--with-partitions); fi
          python3 scripts/archive_iotglove_release.py publish \
            --device "$TARGET_DEVICE" \
            --capture-file "$RUNNER_TEMP/iotglove-build-source.json" \
            "${ARCHIVE_OPTIONS[@]}"
