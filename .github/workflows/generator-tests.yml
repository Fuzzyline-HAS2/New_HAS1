name: Generator tests

on:
  pull_request:
    paths:
      - devices/HAS1_generator/**
      - .github/workflows/generator-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Starter and tagger regression
        run: python devices/HAS1_generator/tests/run_tagger_tests.py
      - name: Telnet history and nonblocking sender with sanitizers
        run: python devices/HAS1_generator/tests/run_telnet_tests.py
