name: Generator tests

on:
  pull_request:
    paths:
      - devices/HAS1_generator/**
      - libraries/DFRobotDFPlayerMini/**
      - libraries/HAS2_Wifi/**
      - .github/workflows/deploy-firmware.yml
      - .github/workflows/generator-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded NeoPixel transport with fault injection
        run: python devices/HAS1_generator/tests/run_neopixel_tests.py
      - name: Starter and tagger regression
        run: python devices/HAS1_generator/tests/run_tagger_tests.py
      - name: Bounded diagnostic logger and RTC journal with sanitizers
        run: python devices/HAS1_generator/tests/run_diagnostic_tests.py
      - name: Telnet history and nonblocking sender with sanitizers
        run: python devices/HAS1_generator/tests/run_telnet_tests.py
      - name: Telnet collector lifecycle and stall recovery with sanitizers
        run: python devices/HAS1_generator/tests/run_telnet_lifecycle_tests.py
      - uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.3
          path: .testdeps/ArduinoJson
      - name: Absolute wire synchronization and completion with sanitizers
        env:
          ARDUINOJSON_INCLUDE: ${{ github.workspace }}/.testdeps/ArduinoJson/src
        run: python devices/HAS1_generator/tests/run_wire_tests.py
      - name: DFPlayer ACK deadline and recovery with actual driver
        run: python devices/HAS1_generator/tests/run_dfplayer_tests.py
      - name: HTTP response deadlines and protocol handling
        env:
          ARDUINOJSON_INCLUDE: ${{ github.workspace }}/.testdeps/ArduinoJson/src
        run: python devices/HAS1_generator/tests/run_http_body_tests.py
