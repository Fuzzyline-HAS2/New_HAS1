name: BLE beacon tests

on:
  pull_request:
    paths:
      - libraries/HAS1BleBeacon/**
      - libraries/HAS2_Wifi/**
      - devices/HAS1_duct/**
      - devices/HAS1_escape_main/**
      - devices/HAS1_generator/**
      - devices/HAS1_tagmachine_main/**
      - .github/workflows/ble-beacon-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - name: BLE state machine and adapter with sanitizers
        run: python libraries/HAS1BleBeacon/tests/run_tests.py
      - uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.3
          path: .testdeps/ArduinoJson
      - name: Duct cooldown, audio and actual polling regression
        env:
          ARDUINOJSON_INCLUDE: ${{ github.workspace }}/.testdeps/ArduinoJson/src
        run: python devices/HAS1_duct/tests/run_polling_tests.py
      - name: Escape state-model regression
        run: python -m pytest -q devices/HAS1_escape_main/tests
