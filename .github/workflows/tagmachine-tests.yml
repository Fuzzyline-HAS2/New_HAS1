name: TagMachine Tests

on:
  push:
    paths:
      - ".github/workflows/deploy-firmware.yml"
      - "devices/HAS1_tagmachine_main/**"
      - "devices/HAS1_tagmachine_sub/**"
      - "devices/iotglove/tools/has2-wifi-result-api.patch"
      - "devices/iotglove/tools/prepare_libraries.py"
      - "libraries/HAS1BleBeacon/**"
      - "libraries/IoTGloveProtocol/**"
      - "libraries/TagMachineProtocol/**"
      - "scripts/archive_iotglove_release.py"
      - "scripts/firmware_targets.py"
      - "scripts/write_firmware_secret.py"
      - ".github/workflows/tagmachine-tests.yml"
  pull_request:
    paths:
      - ".github/workflows/deploy-firmware.yml"
      - "devices/HAS1_tagmachine_main/**"
      - "devices/HAS1_tagmachine_sub/**"
      - "devices/iotglove/tools/has2-wifi-result-api.patch"
      - "devices/iotglove/tools/prepare_libraries.py"
      - "libraries/HAS1BleBeacon/**"
      - "libraries/IoTGloveProtocol/**"
      - "libraries/TagMachineProtocol/**"
      - "scripts/archive_iotglove_release.py"
      - "scripts/firmware_targets.py"
      - "scripts/write_firmware_secret.py"
      - ".github/workflows/tagmachine-tests.yml"
  workflow_dispatch:

env:
  ESP32_CORE_VERSION: "3.3.11"
  ESP32_BOARD_INDEX: "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Beetle recovery and OTA record policies
        run: python3 devices/HAS1_tagmachine_sub/tests/run_tests.py
      - name: OTA wire protocol
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror \
            -Ilibraries/TagMachineProtocol/src \
            libraries/TagMachineProtocol/tests/protocol_test.cpp \
            -o "$RUNNER_TEMP/tagmachine-protocol-test"
          "$RUNNER_TEMP/tagmachine-protocol-test"
      - name: TTGO OTA coordinator policy
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror \
            -Ilibraries/TagMachineProtocol/src \
            devices/HAS1_tagmachine_main/tests/beetle_ota_state_test.cpp \
            -o "$RUNNER_TEMP/tagmachine-main-ota-state-test"
          "$RUNNER_TEMP/tagmachine-main-ota-state-test"

  firmware-compile:
    name: Firmware compile (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device:
          - HAS1_tagmachine_main
          - HAS1_tagmachine_sub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve sketch path and FQBN
        env:
          TARGET_DEVICE: ${{ matrix.device }}
        run: python3 scripts/firmware_targets.py "$TARGET_DEVICE" >> "$GITHUB_ENV"

      - name: Create ephemeral compile-only signing header
        # This public value only satisfies the compiler. The disposable runner
        # checkout is never published and production releases use HMAC_SECRET.
        env:
          # Deliberately avoid the firmware's COMPILE_ONLY/PLACEHOLDER disable
          # markers so LTO links the real OTA path and the slot-size check sees
          # the same code shape as a production build.
          HMAC_SECRET: "TAGMACHINE_CI_LINK_VALIDATION_PUBLIC_KEY_NEVER_RELEASE"
        run: >-
          python3 scripts/write_firmware_secret.py "$DEVICE_DIR"
          --allow-link-validation-secret

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure arduino-cli
        run: arduino-cli config init --overwrite

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "${{ env.ESP32_BOARD_INDEX }}"
          n=0
          until arduino-cli core install "esp32:esp32@${{ env.ESP32_CORE_VERSION }}" --additional-urls "${{ env.ESP32_BOARD_INDEX }}"; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "ESP32 core install failed three times"
              exit 1
            fi
            echo "Download failed; retrying ($n/3) in 15 seconds"
            sleep 15
          done

      - name: Install registry libraries
        run: |
          arduino-cli lib install \
            "Adafruit NeoPixel@1.12.0" \
            "Adafruit PN532@1.3.4" \
            "Adafruit BusIO@1.17.4" \
            "ArduinoJson@7.4.3" \
            "DFRobotDFPlayerMini@1.0.6" \
            "ESP32Encoder@5.0.0" \
            "EspSoftwareSerial@8.1.0"

      - name: Install custom libraries
        run: |
          LIB_DIR="$HOME/Arduino/libraries"
          mkdir -p "$LIB_DIR"
          python3 devices/iotglove/tools/prepare_libraries.py --libraries-dir "$LIB_DIR"

      - name: Compile firmware
        env:
          TARGET_DEVICE: ${{ matrix.device }}
        run: |
          mkdir -p "$RUNNER_TEMP/build-out"
          EXTRA_LIBRARIES=(--library "$GITHUB_WORKSPACE/libraries/TagMachineProtocol")
          EXTRA_LIBRARIES+=(--library "$GITHUB_WORKSPACE/libraries/IoTGloveProtocol")
          if [ "$TARGET_DEVICE" = "HAS1_tagmachine_main" ]; then
            EXTRA_LIBRARIES+=(--library "$GITHUB_WORKSPACE/libraries/HAS1BleBeacon")
          fi
          arduino-cli compile \
            --fqbn "$FQBN" \
            "${EXTRA_LIBRARIES[@]}" \
            --output-dir "$RUNNER_TEMP/build-out" \
            "$DEVICE_DIR"

      - name: Verify OTA slot safety margin
        run: |
          APP_BIN=$(find "$RUNNER_TEMP/build-out" -maxdepth 1 -name '*.ino.bin' -print -quit)
          if [ -z "$APP_BIN" ]; then
            echo "Compiled application image was not produced"
            exit 1
          fi
          APP_SIZE=$(stat -c '%s' "$APP_BIN")
          SLOT_SIZE=$((0x140000))
          REQUIRED_MARGIN=$((32 * 1024))
          echo "TagMachine app image: $APP_SIZE bytes / OTA slot: $SLOT_SIZE bytes"
          if [ "$APP_SIZE" -gt "$((SLOT_SIZE - REQUIRED_MARGIN))" ]; then
            echo "OTA slot safety margin is below ${REQUIRED_MARGIN} bytes"
            exit 1
          fi
