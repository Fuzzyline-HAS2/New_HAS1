# Copy to mosquitto.conf. Replace the listener IP and all absolute paths.
# Isolated trusted game LAN only; MQTT credentials are plaintext without TLS.
listener 1883 192.168.10.10
allow_anonymous false
password_file C:/HAS1/windows-blackbox-logger/mosquitto/passwords
acl_file C:/HAS1/windows-blackbox-logger/mosquitto/acl

# Device flash owns replay; persistent broker queues are not the durability gate.
persistence false
max_queued_messages 64
max_inflight_messages 8
message_size_limit 4096
max_packet_size 8192
log_dest stdout
log_type error
log_type warning
log_type notice

# Firmware currently accepts mqtt:// only. Do not enable a TLS-only listener
# for it until firmware certificate verification/TLS support is implemented:
# cafile C:/HAS1/certs/ca.crt
# certfile C:/HAS1/certs/server.crt
# keyfile C:/HAS1/certs/server.key
