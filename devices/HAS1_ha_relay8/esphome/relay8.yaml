esphome:
  name: has1-relay8
  friendly_name: ESP32-S3 8CH Relay
  # ESPHome resolves this from the configuration's .esphome data directory.
  build_path: ../../../../build/ha-relay8-esphome/firmware

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Preserve current relay outputs during a Wi-Fi outage.
  reboot_timeout: 0s

api:
  port: 6053
  encryption:
    key: !secret api_encryption_key
  # HA/API disconnection must not trigger a reboot and clear the outputs.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

switch:
  - platform: gpio
    id: relay_1
    name: Relay 1
    pin:
      number: GPIO18
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_2
    name: Relay 2
    pin:
      number: GPIO8
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_3
    name: Relay 3
    pin:
      number: GPIO9
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_4
    name: Relay 4
    pin:
      number: GPIO10
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_5
    name: Relay 5
    pin:
      number: GPIO11
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_6
    name: Relay 6
    pin:
      number: GPIO12
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_7
    name: Relay 7
    pin:
      number: GPIO13
      inverted: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_8
    name: Relay 8
    pin:
      number: GPIO14
      inverted: true
    restore_mode: ALWAYS_OFF
